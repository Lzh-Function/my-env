[runtime]
profile = "experiment"
run_directory = ".agent-runs"

[safety]
allow_git_push = false
allow_direct_sbatch_from_capsule = false
allow_pip = false
read_only_workspace = false
require_goal_file = true

[outputs]
required = [
  "live/status.json",
  "live/heartbeat.txt",
  "live/command_log.jsonl",
  "live/current_task.md",
  "artifacts/report.md",
  "artifacts/git_diff.patch",
  "artifacts/metrics.json",
  "artifacts/proposed_next.yaml",
]
