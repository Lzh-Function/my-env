# goal.yaml — agentrun goal definition template
# Generate this file with: agentrun init-goal
# Pass to a run with: agentrun experiment --submit --agent <name> --goal goal.yaml "prompt"
#
# Required fields: project, mode, goal.objective
# Optional fields: goal.success_criteria, budgets, outputs.required

project: my-project

# Mode this goal targets. One of: assist, experiment, campaign, review, multi-review
mode: experiment

goal:
  objective: |
    Describe what the agent should accomplish in plain language.
    Be specific: include the repository, the task, and any constraints.
  success_criteria:
    - artifacts/report.md is written with findings
    - artifacts/metrics.json contains a result summary

budgets:
  walltime: "01:00:00"
  cpu_cores: 2
  memory: 8G
  max_trials: 1
  max_disk_gb: 10

outputs:
  required:
    - artifacts/report.md
    - artifacts/metrics.json
    - live/command_log.jsonl
