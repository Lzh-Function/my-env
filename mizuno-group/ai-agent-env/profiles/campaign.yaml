name: campaign
description: Long-running controlled loop. Human approval is required before production use.
resources:
  gpus: 0
  cpus: 8
  memory: 64G
  time: "04:00:00"
outputs:
  required:
    - live/status.json
    - live/heartbeat.txt
    - artifacts/report.md
    - artifacts/metrics.json
    - artifacts/proposed_next.yaml
    - artifacts/proposed_train.sbatch
policy:
  require_human_approval: true
  forbid:
    - direct_resubmission
    - git_push
    - secret_read

