name: review
description: Single-agent review of a patch, report, or run artifact.
resources:
  gpus: 0
  cpus: 4
  memory: 16G
  time: "01:00:00"
outputs:
  required:
    - live/status.json
    - live/stdout.log
    - reviews/review_findings.json
policy:
  read_only_workspace: true
  forbid:
    - edit_code
    - git_push
    - secret_read

