name: experiment
description: Autonomous experiment inside a controlled capsule.
resources:
  gpus: 0
  cpus: 8
  memory: 64G
  time: "04:00:00"
outputs:
  required:
    - live/status.json
    - live/heartbeat.txt
    - live/stdout.log
    - live/stderr.log
    - live/command_log.jsonl
    - live/current_task.md
    - artifacts/report.md
    - artifacts/git_diff.patch
    - artifacts/metrics.json
    - artifacts/proposed_next.yaml
policy:
  forbid:
    - git_push
    - pip_install
    - sudo
    - apt
    - secret_read
    - direct_sbatch_from_capsule
    - write_to_data

