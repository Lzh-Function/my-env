services:
  tex:
    build:
      context: .
    working_dir: /workspace/LaTeX-Work
    volumes:
      - ${HOME}/workspace/LaTeX-Work:/workspace/LaTeX-Work
      - nvim-data:/home/function/.local/share/nvim
      - nvim-state:/home/function/.local/state/nvim
      - nvim-cache:/home/function/.cache/nvim
      # WSL host $HOME (rw, same path both sides -- claude/codex are symlinks with
      # absolute targets back into $HOME, so the path must match exactly) so that
      # `zj tex claude|codex|both` reuses the host's auth/config/skills as-is.
      # This also covers ~/.config/nvim (no separate mount needed) now that the
      # container's own user home matches $HOME exactly (uid 1000, see Dockerfile).
      - ${HOME}:${HOME}
    tty: true
    stdin_open: true

volumes:
  nvim-data:
  nvim-state:
  nvim-cache:
