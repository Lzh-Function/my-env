name: multi-review
description: Multi-agent review collection and summary.
resources:
  gpus: 0
  cpus: 4
  memory: 32G
  time: "02:00:00"
outputs:
  required:
    - live/status.json
    - live/heartbeat.txt
    - live/stdout.log
    - live/stderr.log
    - live/command_log.jsonl
    - live/events.jsonl
    - live/current_task.md
    - artifacts/report.md
    - artifacts/git_diff.patch
    - artifacts/metrics.json
    - artifacts/run_title.txt
    - reviews/antigravity.md
    - reviews/claude.md
    - reviews/codex.md
    - reviews/summary.md
    - reviews/disagreements.json
    - reviews/final_recommendation.md
policy:
  read_only_workspace: true
  forbid:
    - git_push
    - secret_read

